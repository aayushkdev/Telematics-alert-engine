services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motorq
      POSTGRES_PASSWORD: motorq
      POSTGRES_DB: motorq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.12-alpine
    environment:
      RABBITMQ_DEFAULT_USER: motorq
      RABBITMQ_DEFAULT_PASS: motorq
    ports:
      - "5672:5672"

volumes:
  postgres_data: