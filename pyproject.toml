[project]
name = "motorq"
version = "0.1.0"
description = "MotorQ API"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aio-pika>=9.4,<10",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<0.141",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1,<2",
    "redis>=5,<7",
    "sqlalchemy>=2,<3",
    "starlette>=0.40,<1",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["F401", "B008", "E501", "F821"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.8,<1",
]
